<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biking Brothers</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#070809;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#loading{height:100%;display:grid;place-items:center;text-align:center;color:#bbb}
</style>
</head>
<body>
<div id="loading">Loading Biking Brothers…</div>
<script>
(async function(){
  try{
    const source="https://raw.githubusercontent.com/rohitrcbgowda-8055/Biking-brothers-/2c1929a195079d66aeaec20724770860d8a57910/index.html";
    let html=await fetch(source,{cache:"no-store"}).then(r=>{
      if(!r.ok) throw new Error("Could not load app source");
      return r.text();
    });

    html=html.replace(
      'L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{',
      'L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{'
    ).replace(
      "attribution:'&copy; OpenStreetMap contributors &copy; CARTO'",
      "attribution:'&copy; OpenStreetMap contributors'"
    );

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById("loading").innerHTML =
      "Biking Brothers could not load.<br><small>"+String(e.message||e)+"</small>";
  }
})();
</script>
</body>
</html>
