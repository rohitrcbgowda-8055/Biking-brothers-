<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070809">
<title>Biking Brothers</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#070809;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#loading{height:100%;display:grid;place-items:center;text-align:center;color:#bbb;font-size:18px}
#error{max-width:90%;line-height:1.5}
</style>
</head>
<body>
<div id="loading">Loading Biking Brothers…</div>

<script>
(async function(){
  const SOURCE =
    "https://raw.githubusercontent.com/rohitrcbgowda-8055/Biking-brothers-/main/index.html";

  try {
    let response = await fetch(SOURCE, {cache:"no-store"});
    if (!response.ok) throw new Error("Unable to load the Biking Brothers source.");

    let html = await response.text();

    /* Replace the Carto map completely with OpenStreetMap. */
    html = html.replace(
      /https:\/\/\{s\}\.basemaps\.cartocdn\.com\/dark_all\/\{z\}\/\{x\}\/\{y\}\{r\}\.png/g,
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
    );

    html = html.replace(
      /&copy; OpenStreetMap contributors &copy; CARTO/g,
      "&copy; OpenStreetMap contributors"
    );

    /* Remove old SRI attributes so the Leaflet files cannot fail because
       of an incorrect integrity hash. */
    html = html.replace(/\s+integrity="[^"]*"/g, "");
    html = html.replace(/\s+crossorigin=""/g, "");

    /* Safety check: never display the old Carto tile URL. */
    if (/basemaps\.cartocdn\.com/i.test(html)) {
      throw new Error("Old map provider reference was not removed.");
    }

    document.open();
    document.write(html);
    document.close();

  } catch (error) {
    document.getElementById("loading").innerHTML =
      '<div id="error"><b>Biking Brothers could not load.</b><br>' +
      String(error.message || error) +
      '<br><br>Refresh this page and try again.</div>';
  }
})();
</script>
</body>
</html>
